name: Validate patched sources
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v28.1.0, v28.2.0, main]
    steps:
      - uses: actions/checkout@v6
      - name: Apply Gitea patch series
        env:
          GITEA_REF: ${{ matrix.ref }}
        run: |
          git clone --depth 1 --branch "$GITEA_REF" https://github.com/go-gitea/gitea.git source
          sh patches/apply.sh "$PWD/source" "$PWD/patches/gitea" "$GITEA_REF"

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and check Docker build tools
        run: |
          docker build --target base_sys --tag gitea-build-tools:check .
          docker run --rm gitea-build-tools:check sh -ec 'go version; node --version; npm --version; corepack --version'

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: act
            repository: Sirherobrine23/gitea-runner
            ref: main
          - component: gitea
            repository: go-gitea/gitea
            ref: main
          - component: gitea
            repository: go-gitea/gitea
            ref: release
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and patch source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ matrix.repository }}
          SOURCE_REF: ${{ matrix.ref }}
          COMPONENT: ${{ matrix.component }}
        run: |
          ref="$SOURCE_REF"
          if [ "$ref" = release ]; then
            ref=$(gh api "repos/$SOURCE_REPO/releases/latest" --jq .tag_name)
          fi
          git clone --depth 1 --branch "$ref" "https://github.com/$SOURCE_REPO.git" source
          sh patches/apply.sh "$PWD/source" "$PWD/patches/$COMPONENT" "$ref"
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Runner build and tests
        if: matrix.component == 'act'
        working-directory: source
        run: |
          make
          go test ./internal/app/cmd
      - uses: actions/setup-node@v6
        if: matrix.component == 'gitea'
        with:
          node-version: '24'
      - name: Gitea build and live update tests
        if: matrix.component == 'gitea'
        working-directory: source
        env:
          TAGS: bindata timetzdata
        run: |
          npm install --global corepack --force
          corepack enable pnpm
          pnpm install --frozen-lockfile
          make tidy
          make frontend backend
          go test ./routers/web/repo ./services/websocket -run 'Test(IssueLive|IssueNotifier)'
